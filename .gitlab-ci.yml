cache:
  paths:
    - ~/.cache/pip
    - ~/.platformio/.cache

stages:
  - build
  - deploy

.assume_role: &assume_role
    - >
      STS=($(aws sts assume-role-with-web-identity
      --role-arn ${ROLE_ARN}
      --role-session-name "GitLabRunner-${CI_PROJECT_ID}-${CI_PIPELINE_ID}"
      --web-identity-token $ID_TOKEN
      --duration-seconds 3600
      --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]'
      --output text))
    - export AWS_ACCESS_KEY_ID="${STS[0]}"
    - export AWS_SECRET_ACCESS_KEY="${STS[1]}"
    - export AWS_SESSION_TOKEN="${STS[2]}"


webapp:build:
  stage: build
  image: node:latest
  before_script:
    - cd GardenGlowDesignFrontend
    - mkdir -p ./build
    - npm install
    # Allow warnings to pass a merge request pipeline build.
    - if [ "$CI_PIPELINE_SOURCE" == "merge_request_event" ]; then export CI=false; fi
  script:
    - npm run build > build_output.log 2>&1
    # TODO: Add linting and testing
    # - if [ "$CI_COMMIT_BRANCH" == "main" ]; then npm run lint && npm run test; fi
  artifacts:
    paths:
      - ./GardenGlowDesignFrontend/build/
    when: always
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - GardenGlowDesignFrontend/**/*
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - GardenGlowDesignFrontend/**/*

s3:deploy:
  stage: deploy
  needs:
    - job: "webapp:build"
      artifacts: true
  image:
    name: amazon/aws-cli:latest
    entrypoint: 
      - '/usr/bin/env'
  id_tokens:
      ID_TOKEN:
        aud: react_s3_gardenglow
  before_script:
    - cd GardenGlowDesignFrontend
  script:
    - *assume_role
    - aws s3 sync build/ s3://$S3_BUCKET
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - GardenGlowDesignFrontend/**/*

PlatformIO-esp32:build:
  stage: build
  needs: []
  image: python:3.11
  before_script:
    - pip install -U platformio
  script: "platformio run -e nodemcu-32s -d ./PixelController/"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: always
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - PixelController/**/*
      when: always